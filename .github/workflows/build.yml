name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.1.0). Leave empty to auto-generate v1.0.<run_number>'
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    strategy:
      matrix:
        runtime: [ linux-x64, win-x64 ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Resolve version
      id: version
      shell: bash
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="${{ github.ref_name }}"
        elif [ -n "${{ inputs.version }}" ]; then
          RAW_VER="${{ inputs.version }}"
          if [[ "$RAW_VER" == v* || "$RAW_VER" == V* ]]; then
            TAG="v${RAW_VER:1}"
          else
            TAG="v${RAW_VER}"
          fi
        else
          TAG="v1.0.${{ github.run_number }}"
        fi
        VERSION_NUM="${TAG#v}"
        VERSION_NUM="${VERSION_NUM%%-*}"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache APT packages (libvips)
      if: matrix.runtime == 'linux-x64'
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/apt-cache
        key: ${{ runner.os }}-apt-libvips-v1

    - name: Install libvips
      if: matrix.runtime == 'linux-x64'
      run: |
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${{ runner.temp }}/apt-cache/*.deb" > /dev/null; then
          sudo dpkg -i "${{ runner.temp }}/apt-cache"/*.deb || sudo apt-get install -y -f --no-install-recommends
        else
          mkdir -p "${{ runner.temp }}/apt-cache"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="${{ runner.temp }}/apt-cache" \
            libvips libheif-plugin-aomenc libheif-plugin-dav1d
          sudo rm -rf "${{ runner.temp }}/apt-cache/lock" "${{ runner.temp }}/apt-cache/partial"
          sudo chown -R "$USER:$USER" "${{ runner.temp }}/apt-cache"
        fi

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ matrix.runtime }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-${{ matrix.runtime }}-
          ${{ runner.os }}-nuget-

    - name: Restore dependencies (linux-x64)
      if: matrix.runtime == 'linux-x64'
      run: dotnet restore QuickMangaTool.slnx

    - name: Restore dependencies (win-x64)
      if: matrix.runtime == 'win-x64'
      run: dotnet restore QuickMangaTool/QuickMangaTool.csproj --runtime win-x64

    - name: Run tests
      if: matrix.runtime == 'linux-x64'
      id: test
      run: >
        dotnet test QuickMangaTool.Tests/QuickMangaTool.Tests.csproj
        --configuration Release
        --no-restore
        -p:Version=${{ steps.version.outputs.version }}
        -p:InformationalVersion=${{ steps.version.outputs.tag }}

    - name: Publish (${{ matrix.runtime }})
      run: |
        dotnet publish QuickMangaTool/QuickMangaTool.csproj \
          --configuration Release \
          --runtime ${{ matrix.runtime }} \
          --no-restore \
          -p:Version=${{ steps.version.outputs.version }} \
          -p:InformationalVersion=${{ steps.version.outputs.tag }} \
          --output publish/${{ matrix.runtime }}
        mkdir -p release-assets
        if [ "${{ matrix.runtime }}" = "win-x64" ]; then
          cp "publish/${{ matrix.runtime }}/QuickMangaTool.exe" "release-assets/QuickMangaTool-win-x64.exe"
        else
          cp "publish/${{ matrix.runtime }}/QuickMangaTool" "release-assets/QuickMangaTool-linux-x64"
        fi

    - name: Upload artifact (${{ matrix.runtime }})
      uses: actions/upload-artifact@v7
      with:
        name: QuickMangaTool-${{ matrix.runtime }}
        path: release-assets/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download release assets
      uses: actions/download-artifact@v7
      with:
        path: release-assets
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.tag }}
        name: QuickMangaTool ${{ needs.build.outputs.tag }}
        generate_release_notes: true
        files: release-assets/*
